<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Norway Powder Alert</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>❄️ Norway Powder Alert</h1>
            <p class="subtitle">Real-time powder conditions for Norwegian ski resorts</p>
        </header>

        <nav class="page-nav">
            <a href="index.html" class="nav-link active">Snow Reports</a>
            <a href="freeskiing.html" class="nav-link">Freeskiing Areas</a>
            <a href="hemsedal.html" class="nav-link">Hemsedal Guide</a>
        </nav>

        <div class="controls">
            <button id="refreshBtn" class="btn-primary">Refresh Data</button>
            <button id="powderOnlyBtn" class="btn-secondary">Show Powder Days Only</button>
            <span id="lastUpdate" class="last-update"></span>
        </div>

        <div id="loading" class="loading">Loading powder conditions...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="resortMap" class="map-container"></div>

        <div id="powderAlerts" class="alerts-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
